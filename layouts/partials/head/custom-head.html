<!-- Custom head -->
{{ if .Site.Params.yandexVerification -}}
<meta name="yandex-verification" content="{{ .Site.Params.yandexVerification }}">
{{ end -}}
{{ if .Site.Params.googleVerification -}}
<meta name="google-site-verification" content="{{ .Site.Params.googleVerification }}">
{{ end -}}
{{ if .Site.Params.dzenVerification -}}
<meta name="zen-verification" content="{{ .Site.Params.dzenVerification }}">
{{ end -}}
{{ if .Site.Params.gtm_id -}}
<!-- Google Tag Manager -->
<script async src="https://www.googletagmanager.com/gtm.js?id={{ .Site.Params.gtm_id }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
</script>
<!-- End Google Tag Manager -->
{{ end -}}
